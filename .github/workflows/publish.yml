name: Publish to npm

# Fires when you publish a GitHub Release tagged vX.Y.Z (the tag's version
# must match package.json). Publishes to npm under the @sorb scope with
# provenance via OIDC trusted publishing — no NPM_TOKEN secret to expire.
# (Same auth mode as sorb-leaf/.github/workflows/publish.yml.)
on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # mints the short-lived OIDC credential npm trusts

jobs:
  publish:
    runs-on: ubuntu-latest # GitHub-hosted runner (required for OIDC)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # OIDC trusted publishing needs npm >=11.5.1; 11.x still supports Node 20
      - run: npm install -g npm@^11.5.1

      - name: Verify tag matches package.json version
        if: github.event_name == 'release'
        run: |
          PKG="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json=$PKG  tag=$TAG"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Release tag v$TAG does not match package.json $PKG"
            exit 1
          fi

      - name: Install
        run: npm install

      - name: Publish
        run: |
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            echo "Pre-release → publishing to the 'rc' dist-tag"
            npm publish --provenance --access public --tag rc
          else
            npm publish --provenance --access public
          fi
        # NO NODE_AUTH_TOKEN — OIDC handles auth entirely
